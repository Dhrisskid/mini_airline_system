services:
  app:
    build: .
    container_name: mini-air
    image: mini-air
    ports:
     - "8000:8000"
    env_file:
     - .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    container_name: air-db
    ports:
     - "3308:3306"
    env_file:
      - .env
    volumes:
     - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    
volumes:
    mysql_data:


